<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Library</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <h1>My College Library</h1>
    
    <div class="controls">
      <input type="text" id="nameInput" placeholder="Название книги">
      <input type="text" id="authorInput" placeholder="Автор">
      <button id="addBtn">Добавить в базу</button>
      
      <div class="divider"></div>
      
      <p class="format-note">📝 Поддерживается только формат <strong>.txt</strong></p>
      <input type="file" id="fileInput" accept=".txt">
      <button id="uploadBtn">Загрузить книгу из файла</button>
    </div>

    <div id="readerMode">
      <button id="backToList">← Назад к списку</button>
      <h2 id="readerTitle"></h2>
      <div id="readerContent"></div>
      <div class="reader-controls">
        <span id="pageInfo"></span>
        <button id="nextPageBtn">Следующая страница →</button>
      </div>
    </div>

    <div id="statusBoard">
      <h3>📖 Список книг</h3>
      <ul id="bookList"></ul>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
